# Optional host nginx — TLS on the VPS, HTTP-only Docker nginx on 127.0.0.1:8080 (HRM-style).
# Edge limits should mirror plan 4.9 / 10.11 (NAT-friendly api zone; strict auth only on login/change-password).

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

limit_req_zone $binary_remote_addr zone=host_qms_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=host_qms_api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=host_qms_upload:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=host_qms_ws_handshake:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=host_qms_api_conn:10m;
limit_conn_zone $binary_remote_addr zone=host_qms_ws_conn:10m;

map $request_uri $log_uri {
  ~[\?&](token|password|secret|code)=[^&]* $request_uri?<redacted_query>;
  default $request_uri;
}

log_format qms_redacted_timed '$remote_addr - $remote_user [$time_local] '
  '"$request_method $log_uri $server_protocol" $status $body_bytes_sent '
  '"$http_referer" "$http_user_agent" '
  'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time rid=$request_id';

server {
  listen 80;
  server_name qms.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name qms.example.com;

  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/qms.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/qms.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 21m;
  client_header_timeout 12s;
  client_body_timeout 60s;
  send_timeout 60s;
  reset_timedout_connection on;

  access_log /var/log/nginx/qms.access.log qms_redacted_timed;

  location /socket.io/ {
    limit_conn host_qms_ws_conn 1000;
    limit_req zone=host_qms_ws_handshake burst=300 nodelay;

    proxy_pass http://127.0.0.1:8080/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 75s;
  }

  location = /api/auth/login {
    limit_req zone=host_qms_auth burst=20 nodelay;
    proxy_pass http://127.0.0.1:8080/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/change-password {
    limit_req zone=host_qms_auth burst=20 nodelay;
    proxy_pass http://127.0.0.1:8080/api/auth/change-password;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/auth/ {
    limit_conn host_qms_api_conn 400;
    limit_req zone=host_qms_api burst=400 nodelay;
    proxy_pass http://127.0.0.1:8080/api/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/files/ {
    limit_conn host_qms_api_conn 400;
    limit_req zone=host_qms_upload burst=15 nodelay;
    proxy_pass http://127.0.0.1:8080/api/files/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location /api/ {
    limit_conn host_qms_api_conn 400;
    limit_req zone=host_qms_api burst=400 nodelay;
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}