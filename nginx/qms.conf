# QMS edge reverse proxy (mounted as /etc/nginx/conf.d/default.conf).
# Timeouts: plan section 10.2. Rate/WS: 5.3, 5.11, 10.11.

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

limit_req_zone $binary_remote_addr zone=qms_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=qms_api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=qms_upload:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=qms_ws_handshake:10m rate=20r/s;

limit_conn_zone $binary_remote_addr zone=qms_api_conn:10m;
limit_conn_zone $binary_remote_addr zone=qms_ws_conn:10m;

map $request_uri $log_uri {
  ~^/api/auth/[^/]+/callback[\?&].+ /api/auth/<redacted>/callback?<redacted>;
  ~[\?&](token|password|secret|code)=[^&]* $request_uri?<redacted_query>;
  default $request_uri;
}

log_format qms_redacted_timed '$remote_addr - $remote_user [$time_local] '
  '"$request_method $log_uri $server_protocol" $status $body_bytes_sent '
  '"$http_referer" "$http_user_agent" '
  'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time rid=$request_id';

upstream qms_fe {
  server qms-fe:3000;
  keepalive 32;
  keepalive_timeout 60s;
}

upstream qms_be {
  server qms-be:3001;
  keepalive 32;
  keepalive_timeout 60s;
}

server {
  listen 80;
  server_name _;

  server_tokens off;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  server_tokens off;

  ssl_certificate /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:QMS_SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 21m;
  client_header_timeout 12s;
  client_body_timeout 60s;
  send_timeout 60s;
  reset_timedout_connection on;
  keepalive_timeout 65s;

  access_log /var/log/nginx/access.log qms_redacted_timed;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  location /internal/ {
    return 404;
  }

  location /socket.io/ {
    limit_conn qms_ws_conn 1000;
    limit_conn_status 429;
    limit_req zone=qms_ws_handshake burst=300 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_connect_timeout 5s;
  }

  location /api/files/ {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_upload burst=15 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/files/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 110s;
    proxy_send_timeout 110s;
  }

  # Zone auth (2r/s): password endpoints only — plan 4.9, 10.11, H14
  location = /api/auth/login {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_auth burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 4s;
    proxy_send_timeout 4s;
  }

  location = /api/auth/change-password {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_auth burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/auth/change-password;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 4s;
    proxy_send_timeout 4s;
  }

  # session, refresh, logout, me — zone api (NAT-friendly), timeout 4s (plan 10.2)
  location /api/auth/ {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_api burst=400 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 4s;
    proxy_send_timeout 4s;
  }

  location ~* ^/api/.+/export(/|$|\?) {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_api burst=400 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 115s;
    proxy_send_timeout 115s;
  }

  location /api/ {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_api burst=400 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
  }

  location /_next/static/ {
    access_log off;
    expires 1y;
    proxy_pass http://qms_fe;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location ~* ^/(?!api/|_next/|socket\.io/).*\.(png|jpe?g|gif|webp|svg|ico|woff2?)$ {
    proxy_pass http://qms_fe;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location / {
    proxy_pass http://qms_fe;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
}