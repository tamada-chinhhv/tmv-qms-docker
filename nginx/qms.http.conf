# HTTP-only edge for host-TLS topology (mount as default.conf; host ssl.example.conf → 127.0.0.1:8080).
# Same rate/upload maps as qms.conf. No TLS redirect loop.

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

limit_req_zone $binary_remote_addr zone=qms_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=qms_ws_handshake:10m rate=20r/s;

map $request_uri $qms_upload_path {
  default 0;
  ~^/api/attachments/?$ 1;
  ~^/api/(incidents|ncrs)/[^/]+/(photos|documents)/?$ 1;
}

map $request_method $qms_method_post {
  default 0;
  POST 1;
}

map "$qms_method_post:$qms_upload_path" $qms_is_upload_post_path {
  default 0;
  1:1 1;
}

map $qms_is_upload_post_path $qms_upload_limit_key {
  default "";
  1 $binary_remote_addr;
}

map $qms_is_upload_post_path $qms_api_limit_key {
  1 "";
  0 $binary_remote_addr;
}

limit_req_zone $qms_api_limit_key zone=qms_api:10m rate=200r/s;
limit_req_zone $qms_upload_limit_key zone=qms_upload:10m rate=5r/s;

limit_conn_zone $binary_remote_addr zone=qms_api_conn:10m;
limit_conn_zone $binary_remote_addr zone=qms_ws_conn:10m;

map $request_uri $log_uri {
  ~^/api/auth/[^/]+/callback[\?&].+ /api/auth/<redacted>/callback?<redacted>;
  ~[\?&](token|password|secret|code)=[^&]* $request_uri?<redacted_query>;
  default $request_uri;
}

log_format qms_redacted_timed '$remote_addr - $remote_user [$time_local] '
  '"$request_method $log_uri $server_protocol" $status $body_bytes_sent '
  '"$http_referer" "$http_user_agent" '
  'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time rid=$request_id';

upstream qms_fe {
  server qms-fe:3000;
  keepalive 32;
  keepalive_timeout 60s;
}

upstream qms_be {
  server qms-be:3001;
  keepalive 32;
  keepalive_timeout 60s;
}

server {
  listen 80;
  server_name _;

  server_tokens off;

  client_max_body_size 21m;
  client_header_timeout 12s;
  client_body_timeout 60s;
  send_timeout 60s;
  reset_timedout_connection on;
  keepalive_timeout 65s;

  access_log /var/log/nginx/access.log qms_redacted_timed;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  location /internal/ {
    return 404;
  }

  location = /nginx-health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/api/health(/|$) {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://qms_be;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }

  location /socket.io/ {
    limit_conn qms_ws_conn 1000;
    limit_conn_status 429;
    limit_req zone=qms_ws_handshake burst=300 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_connect_timeout 5s;
  }

  location /api/files/ {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_api burst=400 nodelay;
    limit_req zone=qms_upload burst=15 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/files/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location ~ ^/api/(incidents|ncrs)/[^/]+/(photos|documents)/?$ {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_api burst=400 nodelay;
    limit_req zone=qms_upload burst=15 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 110s;
    proxy_send_timeout 110s;
    client_body_timeout 60s;
  }

  location ~ ^/api/attachments/?$ {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_api burst=400 nodelay;
    limit_req zone=qms_upload burst=15 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 110s;
    proxy_send_timeout 110s;
    client_body_timeout 60s;
  }

  location = /api/auth/login {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_auth burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 4s;
    proxy_send_timeout 4s;
  }

  location = /api/auth/change-password {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_auth burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/auth/change-password;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 4s;
    proxy_send_timeout 4s;
  }

  location /api/auth/ {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_api burst=400 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 4s;
    proxy_send_timeout 4s;
  }

  location ~* ^/api/.+/export(/|$|\?) {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_api burst=400 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 115s;
    proxy_send_timeout 115s;
  }

  location /api/ {
    limit_conn qms_api_conn 400;
    limit_conn_status 429;
    limit_req zone=qms_api burst=400 nodelay;
    limit_req_status 429;

    proxy_pass http://qms_be/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
  }

  location /_next/static/ {
    access_log off;
    expires 1y;
    proxy_pass http://qms_fe;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* ^/(?!api/|_next/|socket\.io/).*\.(png|jpe?g|gif|webp|svg|ico|woff2?)$ {
    proxy_pass http://qms_fe;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    proxy_pass http://qms_fe;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
}