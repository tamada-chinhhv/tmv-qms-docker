# Local dependencies for tmv-qms-be / tmv-qms development on the host.
# docker compose -f docker-compose.dev.yml up -d
#
# All published ports bind to 127.0.0.1 only.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tmv-qms-dev-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-qms_db}
      QMS_MIGRATOR_PASSWORD: ${QMS_MIGRATOR_PASSWORD:?QMS_MIGRATOR_PASSWORD is required}
      QMS_APP_PASSWORD: ${QMS_APP_PASSWORD:?QMS_APP_PASSWORD is required}
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "log_min_duration_statement=500ms",
        "-c",
        "log_lock_waits=on",
        "-c",
        "track_io_timing=on",
        "-c",
        "max_connections=100",
      ]
    volumes:
      - qms_dev_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tmv-qms-dev-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "volatile-lru",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    volumes:
      - qms_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: tmv-qms-dev-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  qms_dev_pgdata:
  qms_dev_redis_data: