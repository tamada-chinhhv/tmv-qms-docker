# Production: pre-built images only (no build on server).
# Set secrets via .env (see .env.example). Never commit real credentials.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tmv-qms-postgres
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-qms_db}
      QMS_MIGRATOR_PASSWORD: ${QMS_MIGRATOR_PASSWORD:?QMS_MIGRATOR_PASSWORD is required}
      QMS_APP_PASSWORD: ${QMS_APP_PASSWORD:?QMS_APP_PASSWORD is required}
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "log_min_duration_statement=500ms",
        "-c",
        "log_lock_waits=on",
        "-c",
        "track_io_timing=on",
        "-c",
        "max_connections=100",
      ]
    volumes:
      - qms_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: tmv-qms-redis
    restart: unless-stopped
    networks:
      - internal
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        "set -eu; umask 077; printf 'requirepass %s\\nappendonly yes\\nmaxmemory 128mb\\nmaxmemory-policy volatile-lru\\n' \"$$REDIS_PASSWORD\" > /tmp/redis-server.conf; exec redis-server /tmp/redis-server.conf",
      ]
    volumes:
      - qms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  qms-be:
    image: tmv-qms-be:latest
    pull_policy: never
    container_name: tmv-qms-be
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    user: "1001:1001"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:?MIGRATE_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRETS: ${JWT_SECRETS:?JWT_SECRETS is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      STORAGE_DIR: /data/storage
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:?SYSTEM_ADMIN_USERNAME is required}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:?SYSTEM_ADMIN_PASSWORD is required}
    volumes:
      - qms_storage:/data/storage
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  qms-fe:
    image: tmv-qms-fe:latest
    pull_policy: never
    container_name: tmv-qms-fe
    restart: unless-stopped
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    user: "1001:1001"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      qms-be:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    container_name: tmv-qms-nginx
    restart: unless-stopped
    networks:
      - edge
      - internal
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_EDGE_CONF:-./nginx/qms.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
    depends_on:
      qms-fe:
        condition: service_healthy
      qms-be:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/nginx-health || wget -qO- --no-check-certificate https://127.0.0.1/nginx-health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

networks:
  edge:
    name: qms_edge
  internal:
    name: qms_internal
    internal: true

volumes:
  qms_pgdata:
  qms_redis_data:
  qms_storage: